apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: code101-prod
resources:
  - ../../base
images:
  - name: code101/api
    newTag: 1.0.0
replicas:
  - name: api
    count: 3
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - GREETING=hello from prod
