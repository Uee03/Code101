services:
  web:
    image: myorg/web:latest
    ports:
      - "80:8000"
    environment:
      - DATABASE_URL=postgres://app:secret@db/app
      - SESSION_SECRET=changeme
    depends_on:
      - db
  db:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: secret
    volumes:
      - ./pgdata:/var/lib/postgresql/data
