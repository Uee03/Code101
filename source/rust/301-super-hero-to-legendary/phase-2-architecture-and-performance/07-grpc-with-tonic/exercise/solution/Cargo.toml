[package]
name = "inventory_grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "=0.14.6"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
