[package]
name = "perf_lab"
version = "0.1.0"
edition = "2024"

[dependencies]

[dev-dependencies]
criterion = "=0.8.2"

[[bench]]
name = "compare"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
