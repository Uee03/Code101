apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: code101-scale
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: code101-scale
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      default:
        memory: 256Mi
      max:
        memory: 1Gi
