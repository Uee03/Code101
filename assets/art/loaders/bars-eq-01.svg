<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Loading (bars-eq-01)">
  <style>.b0{transform-origin:8px 20px;animation:eq 0.9s ease-in-out infinite;animation-delay:0s}.b1{transform-origin:12px 20px;animation:eq 0.9s ease-in-out infinite;animation-delay:0.3s}.b2{transform-origin:16px 20px;animation:eq 0.9s ease-in-out infinite;animation-delay:0.6s}@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}</style>
  <line class="b0" x1="8" y1="20" x2="8" y2="8" stroke-width="2.5"/><line class="b1" x1="12" y1="20" x2="12" y2="8" stroke-width="2.5"/><line class="b2" x1="16" y1="20" x2="16" y2="8" stroke-width="2.5"/>
</svg>
