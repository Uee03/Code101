[project]
name = "tasksteams-api"
version = "1.0.0"
description = "Tasks and Teams API, the Python backend of the Code101 capstones"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "SQLAlchemy>=2.1,<2.2",
    "psycopg[binary]>=3.3,<3.4",
    "PyJWT[crypto]>=2.15,<3",
]
