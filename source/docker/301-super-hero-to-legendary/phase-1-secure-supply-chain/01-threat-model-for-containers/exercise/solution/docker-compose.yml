services:
  api:
    image: python:3.13-slim
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      API_TOKEN_FILE: /run/secrets/api_token
    secrets:
      - api_token
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
secrets:
  api_token:
    file: ./secrets/api_token.txt
