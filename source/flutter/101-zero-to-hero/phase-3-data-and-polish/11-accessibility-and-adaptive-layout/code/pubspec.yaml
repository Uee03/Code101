name: shopping_list
description: A shopping list app for Code101.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.1
  flutter_svg: 2.5.0
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/plus.svg
    - assets/icons/trash.svg
    - assets/icons/list.svg
