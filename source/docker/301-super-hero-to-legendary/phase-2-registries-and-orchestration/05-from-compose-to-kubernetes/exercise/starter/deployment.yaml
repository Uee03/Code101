apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: code101
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: code101/api:1.0.0
          ports:
            - name: http
              containerPort: 8080
