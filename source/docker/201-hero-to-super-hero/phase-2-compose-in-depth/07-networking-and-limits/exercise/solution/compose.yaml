name: code101-net

services:
  api:
    build: .
    image: code101-net-api:201
    ports:
      - "127.0.0.1:8080:8000"
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    pids_limit: 100

  edge:
    build: .
    image: code101-net-edge:201
    command: ["sleep", "infinity"]
    networks:
      - frontend

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
