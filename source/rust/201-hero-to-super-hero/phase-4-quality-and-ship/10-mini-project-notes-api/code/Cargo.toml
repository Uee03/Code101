[package]
name = "notes_api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.100"
axum = "=0.8.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tower = { version = "=0.5.2", features = ["util"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["json"] }
