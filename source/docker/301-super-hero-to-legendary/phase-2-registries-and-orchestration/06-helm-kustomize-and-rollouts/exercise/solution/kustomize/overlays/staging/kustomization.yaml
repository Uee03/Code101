apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: code101-staging
resources:
  - ../../base
images:
  - name: code101/api
    newTag: 2.0.0
replicas:
  - name: api
    count: 2
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - GREETING=hello from staging
