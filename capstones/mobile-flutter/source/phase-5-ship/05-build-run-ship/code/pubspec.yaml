name: tasks_flutter
description: Code101 Tasks and Teams Android client.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.11.1
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  dio: 5.11.1
  json_annotation: 4.12.0
  flutter_appauth: 13.0.0
  flutter_secure_storage: 11.2.0
  drift: 2.35.4
  drift_flutter: 0.3.1
  connectivity_plus: 7.3.2
  workmanager: 0.10.10
  flutter_svg: 2.5.0
  uuid: 4.6.0
  intl: 0.20.3
  path_provider: 2.1.6
dev_dependencies:
  flutter_lints: 6.0.0
  swagger_parser: 2.3.0
  json_serializable: 6.15.2
  build_runner: 2.17.1
  drift_dev: 2.35.3
flutter:
  uses-material-design: false
  assets:
    - lib/l10n/app_en.arb
    - assets/icons/log-in.svg
    - assets/icons/log-out.svg
    - assets/icons/refresh-cw.svg
    - assets/icons/team.svg
    - assets/icons/folder.svg
    - assets/icons/list.svg
    - assets/icons/plus.svg
    - assets/icons/settings.svg
    - assets/icons/wifi-off.svg
    - assets/icons/message-square.svg
