apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress-same-namespace
  namespace: code101
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
